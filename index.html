<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>Seating plan</title>
<style>
:root{color-scheme:light;--surface:#fff;--panel:#F1F2F6;--chip:#EDEFF4;--line:#E0E2E9;--text:#15151C;--sec:#5B5C67;--muted:#8A8B95;--acc:#4F46B7;--accsoft:#E9E8F7;--danger:#A32D2D;--success:#1D6B4F}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--surface);color:var(--text);-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;font:16px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
#app{position:absolute;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:env(safe-area-inset-top) 8px calc(8px + env(safe-area-inset-bottom))}
header{flex:none;display:flex;align-items:center;gap:8px;height:52px;padding:0 2px 0 8px}
#title{flex:1;min-width:0;font-size:18px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;width:48px;height:48px;border:0;border-radius:24px;background:var(--chip);color:var(--acc);display:flex;align-items:center;justify-content:center}
.ib svg{width:24px;height:24px}
.ib .cnt{position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--acc);color:#fff;font:700 11px/18px -apple-system,sans-serif;text-align:center}
.ib .cnt:empty{display:none}
.pillb{flex:none;height:44px;padding:0 14px 0 10px;border:0;border-radius:22px;background:var(--chip);color:var(--acc);display:flex;align-items:center;gap:6px;font-size:15px;font-weight:650}
.pillb svg{width:22px;height:22px}
.pillb[aria-pressed=true]{background:var(--acc);color:#fff}
#stage{position:relative;flex:1 1 0;min-height:0;touch-action:none}
.tbl{position:absolute;background:var(--panel);border:1.5px solid var(--line);border-radius:16px}
.slot{position:absolute;left:0;top:0;border:1.5px dashed var(--line);border-radius:12px;display:none}
.slot.empty{display:block}
.slot.gap{display:block;border-color:var(--acc);background:var(--accsoft)}
.card{position:relative;display:flex;align-items:center;justify-content:center;padding:0 12px 0 26px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(21,21,28,.07);font-size:17px;font-weight:600;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
.card .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;pointer-events:none}
.card .grip{position:absolute;left:9px;top:50%;width:12px;height:18px;margin-top:-9px;background:radial-gradient(circle at 2px 2px,#B3B5C0 1.5px,transparent 2px) 0 0/6px 6px;pointer-events:none}
.card .b{display:none;position:absolute;top:-7px;right:-6px;width:19px;height:19px;border-radius:50%;background:var(--danger);color:#fff;font:700 12px/19px -apple-system,sans-serif;text-align:center;font-style:normal;pointer-events:none}
.card.apart .b{display:block}
.card.apart{border-color:var(--danger)}
#stage .card{position:absolute;left:0;top:0}
#stage.live .card{transition:transform .2s cubic-bezier(.2,.8,.2,1),opacity .15s}
#stage .card.gone{opacity:0;pointer-events:none}
#stage .card.src,#tray .card.src{visibility:hidden}
.card.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;border-color:var(--acc);box-shadow:0 14px 28px rgba(79,70,183,.35),0 2px 6px rgba(21,21,28,.2);cursor:grabbing;will-change:transform}
.card.ghost.fly{transition:transform .13s ease-out,width .13s,height .13s,opacity .1s}
#trayWrap{flex:none;margin-top:6px}
#tray{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:84px;padding:10px;border:2px dashed #C9CAD6;border-radius:18px;background:var(--surface);transition:background .15s,border-color .15s}
#tray .ti{flex:none;width:34px;height:34px;color:#B3B5C0}
#tray.empty{justify-content:center}
#tray.empty .ti{width:44px;height:44px}
#tray.over{background:var(--accsoft);border-color:var(--acc)}
#tray.over .ti{color:var(--acc)}
#tray .card.chip{height:46px;min-width:96px;padding:0 14px 0 26px;font-size:16px}
#sheet{position:fixed;inset:0;z-index:30;background:rgba(21,21,28,.35);display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .panel{width:100%;max-width:520px;background:var(--surface);border-radius:20px 20px 0 0;padding:14px 12px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;max-height:78%}
.srow{display:flex;gap:8px;align-items:center}
.srow input{flex:1;min-width:0;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;background:var(--surface);-webkit-user-select:text;user-select:text}
.srow input:focus{outline:none;border-color:var(--acc)}
.btn{height:48px;padding:0 18px;border:1.5px solid var(--line);border-radius:12px;background:var(--chip);font-weight:600}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.srow .ib{width:48px;flex:none}
ul.plans{list-style:none;margin:0;padding:0;overflow:auto;-webkit-overflow-scrolling:touch}
ul.plans li{display:flex;gap:6px;align-items:center;min-height:56px;border-top:1px solid var(--line)}
ul.plans .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.sm{height:44px;min-width:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;font-weight:600}
.sm.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.sm.acc{color:var(--acc);border-color:var(--accsoft);background:var(--accsoft)}
li input.rn{flex:1;min-width:0;height:44px;border:1.5px solid var(--acc);border-radius:10px;padding:0 10px;font-size:16px;-webkit-user-select:text;user-select:text}
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--text);color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="title"></div>
    <button class="pillb" id="bEnds" aria-pressed="false" aria-label="End seats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="8" y="6" width="8" height="12" rx="2"/><circle cx="12" cy="2.6" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="21.4" r="1.6" fill="currentColor" stroke="none"/></svg>Ends</button>
    <button class="ib" id="bSaved" aria-label="Saved plans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg><span class="cnt" id="cnt"></span></button>
  </header>
  <div id="stage"></div>
  <div id="trayWrap"><div id="tray" aria-label="Not seated"></div></div>
</div>
<div id="sheet"><div class="panel">
  <div class="srow"><input id="pname" type="text" maxlength="60" placeholder="Plan name" autocomplete="off" aria-label="Plan name"><button class="btn primary" id="bSave">Save</button><button class="ib" id="bClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <ul class="plans" id="plans"></ul>
</div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(()=>{
'use strict';
const HOLE=-2;
const $=s=>document.querySelector(s);
const PERSON='<svg class="ti" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 5.5"><circle cx="24" cy="16" r="9"/><path d="M6 43c0-10 8-16 18-16s18 6 18 16"/></svg>';

let S=blank(), geo=null, dragging=null, busy=false, renaming=null, armedDel=null, seq=0;
const stage=$('#stage'), tray=$('#tray'), cards=new Map(), slots=[[],[]], endSlots=[];
let tblEl;

function blank(){return {t:'Seating plan',g:[],a:[],b:[],h:-1,f:-1,e:0,nid:0}}
const cap=()=>S.e?6:7;                 // seats per long side; with end seats there are 2 + 12
const nm=g=>g.n.trim()||'(unnamed)';
const byId=id=>S.g.find(x=>x.id===id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- state <-> compact object ---------- */
function serialize(){return {v:2,t:S.t,e:S.e,g:S.g.map(x=>[x.n,x.c]),a:S.a.slice(),b:S.b.slice(),h:S.h,f:S.f}}
function sanitize(o){
  if(!o||typeof o!=='object'||!Array.isArray(o.g)||o.v!==2)throw new Error('bad plan');
  const st=blank();
  st.t=String(o.t||'').slice(0,60)||'Seating plan';
  st.e=o.e?1:0;
  const c=st.e?6:7;
  o.g.slice(0,40).forEach(r=>{r=Array.isArray(r)?r:[''];st.g.push({id:st.nid++,n:String(r[0]==null?'':r[0]).slice(0,40),c:Math.max(0,Math.floor(+r[1]))||0})});
  const cnt={};st.g.forEach(x=>{if(x.c)cnt[x.c]=(cnt[x.c]||0)+1});
  st.g.forEach(x=>{if(x.c&&cnt[x.c]!==2)x.c=0});
  const used=new Set(),ok=gi=>Number.isInteger(gi)&&st.g[gi]&&!used.has(gi);
  ['a','b'].forEach(k=>(Array.isArray(o[k])?o[k]:[]).forEach(gi=>{if(ok(gi)&&st[k].length<c){st[k].push(gi);used.add(gi)}}));
  if(st.e)['h','f'].forEach(k=>{if(ok(o[k])){st[k]=o[k];used.add(o[k])}});
  return st;
}

/* ---------- link encoding: JSON -> (deflate-raw) -> base64url ---------- */
function b64u(u8){let s='';for(let i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
async function pipe(u8,Ctor){return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new Ctor('deflate-raw'))).arrayBuffer())}
async function enc(o){
  const raw=new TextEncoder().encode(JSON.stringify(o));
  if(window.CompressionStream){try{const z=await pipe(raw,CompressionStream);if(z.length<raw.length)return 'z'+b64u(z)}catch(e){}}
  return 'j'+b64u(raw);
}
async function dec(f){
  let u=unb64u(f.slice(1));
  if(f[0]==='z')u=await pipe(u,DecompressionStream);else if(f[0]!=='j')throw new Error('unknown format');
  return JSON.parse(new TextDecoder().decode(u));
}

/* ---------- geometry ----------
   A seat is [side,i]: side 0 = left column, 1 = right column, i = row down the long side;
   [2,0] is the head end seat, [3,0] the foot end seat (only when S.e). */
function computeGeo(){
  const r=stage.getBoundingClientRect(),W=r.width,H=r.height,c=cap(),rows=c+(S.e?2:0);
  const rowH=Math.max(36,Math.min(74,(H-4)/rows)),ch=rowH-10,tw=Math.round(Math.min(64,Math.max(40,W*.14)));
  const cw=(W-16-tw-16)/2;
  geo={W,H,c,rows,rowH,ch,cw,tw,xL:8,xR:W-8-cw,xC:(W-cw)/2,y0:(H-rowH*rows)/2,left:r.left,top:r.top};
}
function slotXY(s,i){
  const off=S.e?1:0;
  if(s===2)return {x:geo.xC,y:geo.y0+(geo.rowH-geo.ch)/2};
  if(s===3)return {x:geo.xC,y:geo.y0+(geo.c+1)*geo.rowH+(geo.rowH-geo.ch)/2};
  return {x:s?geo.xR:geo.xL,y:geo.y0+(i+off)*geo.rowH+(geo.rowH-geo.ch)/2};
}
function put(el,s,i){const p=slotXY(s,i);el.style.width=geo.cw+'px';el.style.height=geo.ch+'px';el.style.transform=`translate3d(${p.x}px,${p.y}px,0)`}

/* ---------- plans: where everyone lands when `id` is dropped at tgt ----------
   Result {A,B,H,F}: left list, right list, head, foot (HOLE marks the dropped seat). */
function plan(id,tgt){
  const c=cap(),A=S.a.filter(x=>x!==id),B=S.b.filter(x=>x!==id);
  const R={A,B,H:S.h===id?-1:S.h,F:S.f===id?-1:S.f};
  if(tgt.tray)return R;
  // somewhere for a guest who got pushed out: the other side, else a free end seat, else the tray
  const place=(p,O)=>{if(O.length<c)O.push(p);else if(S.e&&R.F===-1)R.F=p;else if(S.e&&R.H===-1)R.H=p};
  const spill=(L,O)=>{while(L.length>c){const p=L.pop();if(p!==HOLE)place(p,O)}};
  if(tgt.end){
    const key=tgt.end==='h'?'H':'F',prev=R[key];R[key]=HOLE;
    if(prev>=0){                                   // the sitter slides onto the shorter side
      const L=A.length<=B.length?A:B,O=L===A?B:A;
      L.splice(key==='H'?0:L.length,0,prev);spill(L,O);
    }
  }else{
    const L=tgt.s?B:A,O=tgt.s?A:B;
    L.splice(Math.min(tgt.k,L.length),0,HOLE);spill(L,O);
  }
  return R;
}
const fillHole=(R,id)=>({A:R.A.map(v=>v===HOLE?id:v),B:R.B.map(v=>v===HOLE?id:v),H:R.H===HOLE?id:R.H,F:R.F===HOLE?id:R.F});
function posMap(R){
  const pos=new Map();
  R.A.forEach((id,i)=>{if(id>=0)pos.set(id,[0,i])});
  R.B.forEach((id,i)=>{if(id>=0)pos.set(id,[1,i])});
  if(S.e){if(R.H>=0)pos.set(R.H,[2,0]);if(R.F>=0)pos.set(R.F,[3,0])}
  return pos;
}
const cur=()=>({A:S.a,B:S.b,H:S.h,F:S.f});

/* a couple is fine when seated next to each other on a side, in the same row on both sides,
   or at an end with the first/last row beside it (or head and foot facing each other) */
function close(p,q){
  if(!p||!q)return false;
  if(p[0]<2&&q[0]<2)return p[0]===q[0]?Math.abs(p[1]-q[1])===1:p[1]===q[1];
  if(p[0]>=2&&q[0]>=2)return p[0]!==q[0];
  const [e,sd]=p[0]>=2?[p,q]:[q,p];
  return sd[1]===(e[0]===2?0:cap()-1);
}
function apartIds(R){
  const pos=posMap(R),out=new Set(),by={};
  S.g.forEach(g=>{if(g.c)(by[g.c]=by[g.c]||[]).push(g.id)});
  Object.values(by).forEach(([x,y])=>{if(!close(pos.get(x),pos.get(y))){out.add(x);out.add(y)}});
  return out;
}

/* ---------- rendering ---------- */
function mkCard(g,chip){
  const el=document.createElement('div');
  el.className='card'+(chip?' chip':'');el.dataset.id=g.id;
  el.innerHTML='<i class="grip"></i><span class="n"></span><i class="b">!</i>';
  el.querySelector('.n').textContent=nm(g);
  return el;
}
function mkSlot(){const e=document.createElement('div');e.className='slot';stage.appendChild(e);return e}
function initStage(){
  tblEl=document.createElement('div');tblEl.className='tbl';stage.appendChild(tblEl);
  for(let s=0;s<2;s++)for(let i=0;i<7;i++)slots[s].push(mkSlot());
  endSlots.push(mkSlot(),mkSlot());
}
function layoutSlots(R){
  const set=(e,s,i,v,show)=>{
    const p=slotXY(s,i);
    e.style.width=geo.cw+'px';e.style.height=geo.ch+'px';e.style.transform=`translate3d(${p.x}px,${p.y}px,0)`;
    e.className='slot'+(!show?'':v===HOLE?' gap':(v===undefined||v===-1)?' empty':'');
  };
  [R.A,R.B].forEach((arr,s)=>{for(let i=0;i<7;i++)set(slots[s][i],s,i,arr[i],i<geo.c)});
  set(endSlots[0],2,0,R.H,S.e);set(endSlots[1],3,0,R.F,S.e);
}
function layoutTable(){
  tblEl.style.left=(geo.xL+geo.cw+8)+'px';tblEl.style.width=geo.tw+'px';
  tblEl.style.top=(geo.y0+(S.e?geo.rowH:0))+'px';tblEl.style.height=geo.rowH*geo.c+'px';
}
function markApart(R){
  const set=apartIds(R);
  document.querySelectorAll('.card:not(.ghost)').forEach(el=>el.classList.toggle('apart',set.has(+el.dataset.id)));
}
const resetCards=()=>{cards.forEach(el=>el.remove());cards.clear()};   // a replaced guest list reuses ids, so never keep old cards
function draw(){
  if(dragging)return;
  computeGeo();layoutTable();
  const pos=posMap(cur());
  cards.forEach((el,id)=>{if(!pos.has(id)){el.remove();cards.delete(id)}});
  pos.forEach((p,id)=>{
    let el=cards.get(id);
    if(!el){el=mkCard(byId(id));cards.set(id,el);stage.appendChild(el)}
    el.classList.remove('gone','src');put(el,p[0],p[1]);
  });
  layoutSlots(cur());
  const un=S.g.filter(g=>!pos.has(g.id));
  tray.className=un.length?'':'empty';
  tray.replaceChildren();
  tray.insertAdjacentHTML('afterbegin',PERSON);
  un.forEach(g=>tray.appendChild(mkCard(g,true)));
  markApart(cur());
  $('#bEnds').setAttribute('aria-pressed',S.e?'true':'false');
  $('#title').textContent=S.t;
  const n=plans().length;$('#cnt').textContent=n?String(n):'';
}

/* ---------- end seats on/off: same people in the same order, reflowed ---------- */
function setEnds(on){
  if(dragging||busy||!!S.e===on)return;
  const order=[];
  if(S.h>=0)order.push(S.h);
  for(let i=0;i<Math.max(S.a.length,S.b.length);i++){if(S.a[i]!==undefined)order.push(S.a[i]);if(S.b[i]!==undefined)order.push(S.b[i])}
  if(S.f>=0)order.push(S.f);
  S.e=on?1:0;S.h=S.f=-1;S.a=[];S.b=[];
  let rest=order;
  if(on){if(order.length>0)S.h=order[0];if(order.length>1)S.f=order[order.length-1];rest=order.slice(1,Math.max(1,order.length-1))}
  rest.forEach((id,i)=>(i%2?S.b:S.a).push(id));
  stage.classList.add('live');persist();draw();
  setTimeout(()=>{if(!dragging)stage.classList.remove('live')},260);
}
$('#bEnds').addEventListener('click',()=>setEnds(!S.e));

/* ---------- drag with pointer events ---------- */
let pend=null;
function onDown(e){
  if(busy||dragging||pend||$('#sheet').classList.contains('on'))return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  const el=e.target.closest&&e.target.closest('.card');if(!el||el.classList.contains('ghost'))return;
  const r=el.getBoundingClientRect();
  pend={id:+el.dataset.id,el,pid:e.pointerId,x0:e.clientX,y0:e.clientY,offX:e.clientX-r.left,offY:e.clientY-r.top,w:r.width,h:r.height};
  try{el.setPointerCapture(e.pointerId)}catch(err){}
}
function startDrag(){
  const p=pend;pend=null;
  const g=p.el.cloneNode(true);g.classList.add('ghost');g.classList.remove('apart','src');
  g.style.width=p.w+'px';g.style.height=p.h+'px';
  document.body.appendChild(g);
  dragging={id:p.id,el:p.el,ghost:g,pid:p.pid,offX:p.offX,offY:p.offY,w:p.w,h:p.h,px:p.x0,py:p.y0,tgt:null,key:''};
  p.el.classList.add('src');
  stage.classList.add('live');
  setGhost(dragging,1.06);
  update();
}
function setGhost(d,scale){d.ghost.style.transform=`translate3d(${d.px-d.offX}px,${d.py-d.offY}px,0) scale(${scale})`}
function targetAt(d){
  const cx=d.px-d.offX+d.w/2,cy=d.py-d.offY+d.h/2;
  const tr=$('#trayWrap').getBoundingClientRect();
  if(cy>tr.top-6)return {tray:true};
  const x=Math.min(Math.max(cx-geo.left,0),geo.W),y=cy-geo.top;
  const r=Math.min(geo.rows-1,Math.max(0,Math.floor((y-geo.y0)/geo.rowH)));
  if(S.e&&r===0)return {end:'h'};
  if(S.e&&r===geo.rows-1)return {end:'f'};
  const s=x<geo.W/2?0:1,n=(s?S.b:S.a).filter(v=>v!==d.id).length;
  return {s,k:Math.min(r-(S.e?1:0),n)};
}
function update(){
  const d=dragging;if(!d)return;
  const t=targetAt(d),key=t.tray?'t':t.end?t.end:t.s+':'+t.k;
  tray.classList.toggle('over',!!t.tray);
  if(key===d.key)return;
  d.key=key;d.tgt=t;
  const pv=plan(d.id,t),pos=posMap(pv);
  cards.forEach((el,id)=>{
    const p=pos.get(id);
    if(id===d.id||!p)el.classList.add('gone');else{el.classList.remove('gone');put(el,p[0],p[1])}
  });
  layoutSlots(pv);
  markApart(fillHole(pv,d.id));
}
function onMove(e){
  if(pend&&e.pointerId===pend.pid){
    if(Math.hypot(e.clientX-pend.x0,e.clientY-pend.y0)<6)return;
    startDrag();
  }
  const d=dragging;if(!d||e.pointerId!==d.pid)return;
  d.px=e.clientX;d.py=e.clientY;setGhost(d,1.06);update();
}
function onUp(e){
  if(pend&&e.pointerId===pend.pid){pend=null;return}
  const d=dragging;if(!d||e.pointerId!==d.pid)return;
  d.px=e.clientX;d.py=e.clientY;
  if(e.type==='pointercancel'){finish(d,null);return}
  d.key='';update();            // settle the preview on the final position
  finish(d,d.tgt);
}
function finish(d,t){
  busy=true;
  const done=()=>{
    d.ghost.remove();dragging=null;busy=false;
    stage.classList.remove('live');tray.classList.remove('over');
    if(t){
      const f=fillHole(plan(d.id,t),d.id);
      S.a=f.A;S.b=f.B;S.h=f.H;S.f=f.F;
      persist();
    }
    draw();
  };
  if(t&&!t.tray){
    const pv=plan(d.id,t),p=slotXY(...posMap(fillHole(pv,d.id)).get(d.id));
    d.ghost.classList.add('fly');
    d.ghost.style.width=geo.cw+'px';d.ghost.style.height=geo.ch+'px';
    d.ghost.style.transform=`translate3d(${geo.left+p.x}px,${geo.top+p.y}px,0) scale(1)`;
    setTimeout(done,140);
  }else if(t){d.ghost.classList.add('fly');d.ghost.style.opacity='0';setTimeout(done,110)}
  else done();
}
document.addEventListener('pointerdown',onDown);
document.addEventListener('pointermove',onMove);
document.addEventListener('pointerup',onUp);
document.addEventListener('pointercancel',onUp);
document.addEventListener('contextmenu',e=>e.preventDefault());
// no page scroll, rubber-band or pull-to-refresh; only the saved-plans list may scroll
document.addEventListener('touchmove',e=>{if(!e.target.closest||!e.target.closest('#plans'))e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- persistence ---------- */
function persist(){
  const o=serialize();
  try{localStorage.setItem('seat2.cur',JSON.stringify(o))}catch(e){}
  const my=++seq;
  enc(o).then(f=>{if(my===seq)history.replaceState(null,'','#'+f)}).catch(()=>{});
}
function plans(){try{const p=JSON.parse(localStorage.getItem('seat2.plans'));return Array.isArray(p)?p:[]}catch(e){return []}}
function savePlans(p){try{localStorage.setItem('seat2.plans',JSON.stringify(p))}catch(e){toast('Could not save')}}
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1600)}

/* ---------- saved plans sheet ---------- */
function renderPlans(){
  $('#plans').innerHTML=plans().map(x=>{
    const name=renaming===x.id?`<input type="text" class="rn" maxlength="60" value="${esc(x.name)}" aria-label="New name">`:`<span class="pn">${esc(x.name)}</span>`;
    const btns=renaming===x.id?`<button class="sm acc" data-pl="ok" data-id="${x.id}">OK</button>`:
      `<button class="sm acc" data-pl="load" data-id="${x.id}">Load</button><button class="sm" data-pl="ren" data-id="${x.id}">Rename</button><button class="sm${armedDel===x.id?' danger':''}" data-pl="del" data-id="${x.id}">${armedDel===x.id?'Delete?':'Delete'}</button>`;
    return `<li>${name}${btns}</li>`;
  }).join('');
  const n=plans().length;$('#cnt').textContent=n?String(n):'';
}
function openSheet(){$('#pname').value=S.t;renaming=null;armedDel=null;renderPlans();$('#sheet').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on')}
$('#bSaved').addEventListener('click',openSheet);
$('#bClose').addEventListener('click',closeSheet);
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
$('#pname').addEventListener('input',e=>{S.t=e.target.value;$('#title').textContent=S.t||'Seating plan';persist()});
$('#bSave').addEventListener('click',()=>{
  const name=($('#pname').value||'').trim()||'Seating plan',p=plans(),o=serialize();
  S.t=name;o.t=name;
  const i=p.findIndex(x=>x.name.toLowerCase()===name.toLowerCase());
  if(i>=0){p[i].st=o;p[i].name=name}else p.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,st:o});
  savePlans(p);renderPlans();draw();persist();toast('Saved ✓');
});
$('#plans').addEventListener('click',e=>{
  const b=e.target.closest('[data-pl]');if(!b)return;
  const p=plans(),x=p.find(q=>q.id===b.dataset.id),a=b.dataset.pl;if(!x)return;
  if(a==='load'){try{const st=sanitize(x.st);st.t=x.name;S=st;resetCards();closeSheet();draw();persist();toast('Loaded ✓')}catch(err){toast('Unreadable plan')}return}
  if(a==='ren'){renaming=x.id;armedDel=null;renderPlans();const i=$('.rn');if(i){i.focus();i.select()}return}
  if(a==='ok'){const i=$('.rn'),v=i&&i.value.trim();if(v){x.name=v;savePlans(p)}renaming=null;renderPlans();return}
  if(a==='del'){if(armedDel===x.id){savePlans(p.filter(q=>q.id!==x.id));armedDel=null}else armedDel=x.id;renderPlans();draw()}
});
$('#plans').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('rn')){const b=$('[data-pl=ok]');if(b)b.click()}});
$('#pname').addEventListener('keydown',e=>{if(e.key==='Enter')$('#bSave').click()});

/* ---------- start ---------- */
async function load(first){
  let st=null;const h=location.hash.slice(1);
  if(h){try{st=sanitize(await dec(h))}catch(e){toast('Could not read link')}}
  if(!st&&first){try{st=sanitize(JSON.parse(localStorage.getItem('seat2.cur')))}catch(e){}}
  if(!st){if(!first)return;st=blank()}
  S=st;resetCards();renaming=null;armedDel=null;draw();persist();
}
initStage();
new ResizeObserver(()=>draw()).observe(stage);
addEventListener('hashchange',()=>load(false));
load(true);
})();
</script>
